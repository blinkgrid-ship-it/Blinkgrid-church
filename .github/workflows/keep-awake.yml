# Keeps the free Render test servers from going to sleep while the team checks the church site.
# Opens the church server and the test site every 5 minutes (Render sleeps a free server after 15 minutes without visitors).
# GitHub may start a scheduled run a few minutes late, so 5 minutes leaves room. Safe to delete this file at any time.
name: keep-awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the church server and the test site
        run: |
          for url in \
            "https://blinkgrid-church-test-api.onrender.com/api/v1/church/resolve?host=grace.example.org" \
            "https://blinkgrid-church-test-site.onrender.com/en/daily"; do
            curl -sS -o /dev/null --max-time 100 -w "%{http_code} %{time_total}s $url\n" "$url" || echo "no answer: $url"
          done
